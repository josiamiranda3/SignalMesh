
name = "signalmess"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"

# The asset layer serves existing files.
# Unknown paths must reach the Worker as real 404 responses.
# The Worker decides whether to serve the SPA shell or return a 404.

not_found_handling = "none"

# API, platform and SPA routes must reach the Worker before
# the Assets layer.
#
# IMPORTANT:
# DeepSpace CLI projectArtifactForm() forwards run_worker_first
# through extraRunWorkerFirst, but currently does not forward
# html_handling.
#
# Therefore, html_handling is intentionally not configured here.
#
# SPA routes are explicitly listed to prevent Cloudflare Assets
# from returning 307 redirects for direct navigation requests.
#
# Bare paths and wildcard paths are both listed explicitly.
# Static assets are intentionally excluded from this list.

run_worker_first = [
  # API and platform routes
  "/api/*",
  "/ws/*",
  "/internal/*",
  "/v1/*",
  "/_deepspace/*",

  # Public platform resources
  "/llms.txt",
  "/llms-full.txt",
  "/.well-known/mcp",
  "/.well-known/mcp.json",
  "/.well-known/mcp/*",

  # Authentication
  "/login",

  # Dashboard
  "/dashboard",
  "/dashboard/*",

  # Investigations
  "/investigations",
  "/investigations/*",

  # Validation
  "/validation",
  "/validation/*",

  # History
  "/history",
  "/history/*",

  # Settings
  "/settings",
  "/settings/*"
]

[vars]
# DeepSpace application identity
DEEPSPACE_APP_ID = "app_01M81TNJ1N7E1R12364FQK4WCK"
APP_NAME = "signalmess"

# OAuth redirect configuration
NATIVE_AUTH_REDIRECT_URIS = ""

# Production application origin
APP_ORIGIN = "https://signalmess.app.space"

# External API and paid operation safeguards
ENABLE_EXTERNAL_APIS = "true"
ENABLE_PAID_OPERATIONS = "true"

# External provider configuration
EXA_SEARCH_TYPE = "auto"
GEMINI_MODEL = "gemini-2.5-flash"

# Daily usage limits
RESEARCH_DAILY_LIMIT = "3"
ANALYSIS_DAILY_LIMIT = "3"

# Global usage limits
RESEARCH_GLOBAL_DAILY_LIMIT = "30"
ANALYSIS_GLOBAL_DAILY_LIMIT = "30"

# Duplicate request protection
DUPLICATE_GUARD_SECONDS = "90"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppRecordRoom"]

[durable_objects]
bindings = [
  { name = "RECORD_ROOMS", class_name = "AppRecordRoom" }
]

# --- DeepSpace detected secrets (names only; values live in npx deepspace secrets) ---
# EXA_API_KEY
# GEMINI_API_KEY
# --- end DeepSpace detected secrets ---

[dev]
port = 8787
inspector_port = 9237
