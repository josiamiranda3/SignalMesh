<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090f" />
    <!--
      Private application: no route may be indexed.

      This is one shell for every route, so a global directive is the only
      correct scope — per-page metadata would require prerendering, which this
      build does not do. `noindex` keeps the page *crawlable* (a crawler must be
      able to fetch it to read the directive) while forbidding it from appearing
      in results; public/robots.txt adds `Disallow: /` on top.

      Revisit only together with a real public-page strategy — see
      docs/preflight-deepspace-v0.2.4.1.md.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>SignalMesh — Research &amp; Evidence Intelligence</title>
    <meta
      name="description"
      content="SignalMesh transforma informação dispersa em evidências rastreáveis: pesquisa externa, análise estruturada por IA e validação humana com histórico completo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="SignalMesh — Research & Evidence Intelligence" />
    <meta
      property="og:description"
      content="Plataforma de inteligência de pesquisa com evidências rastreáveis, análise por IA e validação humana."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; color: #f2f5fb; background: #07090f">
        O SignalMesh requer JavaScript para funcionar.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
